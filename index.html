<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Generator</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #16161b;
    --panel-2: #1e1e25;
    --line: #2a2a33;
    --text: #e9e9ee;
    --muted: #8b8b98;
    --accent: #c9b8ff;
    --danger: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; overflow: hidden; }

  #panel { width: 360px; flex: none; height: 100%; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 14px 16px 40px; }
  #stage { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 32px; background: var(--bg); }
  #view { display: block; }

  .toolbar { display: flex; gap: 6px; margin-bottom: 14px; }
  button, select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; cursor: pointer; }
  button:hover { border-color: #3d3d4a; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #141218; border-color: transparent; font-weight: 600; flex: 1; }
  button.icon { padding: 6px 8px; line-height: 1; }

  section { border-top: 1px solid var(--line); padding: 12px 0 6px; }
  section h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .row { display: grid; grid-template-columns: 104px 1fr 58px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row label { color: #c4c4cf; }
  .ends { display: flex; justify-content: space-between; margin: -6px 66px 10px 112px; font-size: 11px; color: var(--muted); }
  input[type=number], input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  input[type=number] { -moz-appearance: textfield; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input.bad { border-color: var(--danger); }
  select { padding: 4px 6px; border-radius: 6px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #34343f; border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 3px; background: #34343f; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px;
    border-radius: 50%; background: var(--text); border: none; }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--text); border: none; }

  .dims { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 8px; }
  .dims span { color: var(--muted); }
  .seed { display: grid; grid-template-columns: 104px 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }

  .coverage { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
  .crow { display: grid; grid-template-columns: 14px 28px 78px 1fr 50px 22px; gap: 6px; align-items: center;
    margin-bottom: 6px; padding: 4px; border-radius: 7px; }
  .crow.over { background: var(--panel-2); }
  .handle { cursor: grab; color: var(--muted); user-select: none; text-align: center; font-size: 12px; }
  .swatch { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch::-webkit-color-swatch { border: none; border-radius: 5px; }
  .swatch::-moz-color-swatch { border: none; border-radius: 5px; }
  .pct { position: relative; }
  .pct input { padding-right: 16px; }
  .pct::after { content: "%"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .remove { padding: 2px 0; background: none; border: none; color: var(--muted); font-size: 16px; }
  .remove:hover { color: var(--danger); }
  .add { width: 100%; margin: 4px 0 12px; border-style: dashed; color: #c4c4cf; background: none; }

  .looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .look { position: relative; cursor: pointer; }
  .look img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .look:hover img { border-color: var(--accent); }
  .look span { display: block; margin-top: 3px; font-size: 11px; color: #c4c4cf; }
  .look .remove { position: absolute; top: 2px; right: 4px; display: none; color: #fff; text-shadow: 0 0 3px #000; }
  .look:hover .remove { display: block; }
  #saveLook { width: 100%; }

  .toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer; color: #c4c4cf; }
  .toggle input { accent-color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .hidden { display: none !important; }

  @media (max-width: 760px) {
    body { flex-direction: column-reverse; overflow: auto; }
    #panel { width: 100%; height: auto; border-right: none; border-top: 1px solid var(--line); }
    #stage { height: 50vh; flex: none; padding: 16px; }
  }
</style>
</head>
<body>
<aside id="panel">
  <div class="toolbar">
    <button class="primary" id="exportBtn">Export PNG</button>
    <button id="randomBtn" title="Randomise flow & layering">Randomise</button>
    <button id="resetBtn" title="Reset to defaults">Reset</button>
  </div>

  <section>
    <h2>Saved looks</h2>
    <div class="looks" id="looks"></div>
    <button id="saveLook">+ Save current look</button>
  </section>

  <section id="colorSection">
    <h2>Colours</h2>
    <div class="coverage" id="coverage"></div>
    <div id="colorList"></div>
    <button class="add" id="addColor">+ Add colour</button>
  </section>

  <section>
    <h2>Canvas</h2>
    <div class="dims">
      <input type="number" id="w" min="16" max="16000" step="1" aria-label="Width (px)">
      <span>×</span>
      <input type="number" id="h" min="16" max="16000" step="1" aria-label="Height (px)">
    </div>
    <div class="seed">
      <label for="seed">Seed</label>
      <input type="number" id="seed" step="1">
      <button class="icon" id="seedBtn" title="New seed">⟳</button>
    </div>
  </section>

  <div id="groups"></div>
</aside>
<main id="stage"><canvas id="view"></canvas></main>

<script>
const VERT = `#version 300 es
in vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

const FRAG = `#version 300 es
precision highp float;
precision highp int;
out vec4 o;

uniform vec2 uRes, uOut, uSeed, uCorT;
uniform int uMode, uOctaves, uCount, uLoop;
uniform float uTime, uLoopLen, uScale, uFluid, uDisturb, uTurb, uStretch, uDrip, uDripFreq, uGravity, uBands;
uniform float uQ[65];
uniform vec3 uCol[10];   // OKLab
uniform float uStop[10];
uniform float uSoftB[10];
uniform float uSpeckle, uCorrupt, uGrain, uGrainSize, uGrainT;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

const mat2 ROT = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p, int oct) {
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 8; i++) {
    if (i >= oct) break;
    s += a * snoise(p);
    n += a;
    p = ROT * p + vec2(3.1, 1.7);
    a *= 0.5;
  }
  return s / n;
}

float hash(vec2 p) {
  uvec2 q = uvec2(ivec2(floor(p)) + 65536);
  uint h = (q.x * 0x8da6b343u) ^ (q.y * 0xd8163841u);
  h = (h ^ (h >> 15)) * 0x2c1b3c6du;
  h = (h ^ (h >> 12)) * 0x297a2d39u;
  h ^= h >> 15;
  return float(h) / 4294967295.0;
}

// Divergence-free swirl direction from a 2-octave noise potential
vec2 curl(vec2 p) {
  const float e = 0.02;
  float n1 = snoise(p + vec2(0.0, e)) + 0.5 * snoise(2.1 * (p + vec2(0.0, e)) + 4.3);
  float n2 = snoise(p - vec2(0.0, e)) + 0.5 * snoise(2.1 * (p - vec2(0.0, e)) + 4.3);
  float n3 = snoise(p + vec2(e, 0.0)) + 0.5 * snoise(2.1 * (p + vec2(e, 0.0)) + 4.3);
  float n4 = snoise(p - vec2(e, 0.0)) + 0.5 * snoise(2.1 * (p - vec2(e, 0.0)) + 4.3);
  return vec2(n1 - n2, n4 - n3) / (2.0 * e);
}

// Scalar paint field. uv.y grows downward.
float field(vec2 uv, float time) {
  vec2 p = uv * uScale;
  // Columns of colour dragged downward by different amounts -> drips
  float dn = 0.75 * snoise(vec2(p.x * uDripFreq, uSeed.x + 0.2 * p.y))
           + 0.25 * snoise(vec2(p.x * uDripFreq * 2.1, uSeed.y - 0.3 * p.y));
  p.y -= uDrip * smoothstep(-0.7, 0.9, dn);

  // Disturbance: advect the paint along swirling, non-directional currents
  // so colours pool, curl and seep into each other like water or wet sand
  if (uDisturb > 0.0) {
    vec2 drift = vec2(0.2, -0.13) * time + uSeed.yx;
    for (int i = 0; i < 4; i++) {
      p += uDisturb * 0.035 * curl(p * 0.7 + drift);
    }
    // Fine lobed seepage along the edges
    p += uDisturb * 0.035 * vec2(snoise(p * 7.0 + drift), snoise(p * 7.0 + drift + 3.7));
  }

  // Vertical stretch elongates every feature into a run; disturbance relaxes it
  float stretch = mix(uStretch, 1.0, 0.7 * uDisturb);
  vec2 q = vec2(p.x, p.y / stretch) + uSeed;
  q.y -= time;

  int wo = min(uOctaves, 3);
  vec2 tq = q * uTurb;
  vec2 w1 = vec2(fbm(tq, wo), fbm(tq + vec2(5.2, 1.3), wo));
  vec2 w2 = vec2(fbm(tq + 1.2 * uFluid * w1 + vec2(1.7, 9.2) + 0.13 * time, wo),
                 fbm(tq + 1.2 * uFluid * w1 + vec2(8.3, 2.8) - 0.11 * time, wo));
  // Gravity: bias the warp so pixels sample paint from above them
  w2.y = mix(w2.y, -sqrt(w2.y * w2.y + 0.004) * 1.4, uGravity);

  float f = fbm(q + 0.6 * uFluid * w2, uOctaves);
  float t = clamp(0.5 + f * 1.15, 0.0, 1.0);
  return 1.0 - abs(1.0 - mod(t * uBands, 2.0));
}

// Seamless loops crossfade the field with itself one loop-length earlier
float sampleField(vec2 uv) {
  if (uLoop == 0) return field(uv, uTime);
  return mix(field(uv, uTime), field(uv, uTime - uLoopLen), uTime / uLoopLen);
}

// Map the field value to its rank (0..1) so colour stops equal area coverage
float rankOf(float t) {
  if (t <= uQ[0]) return 0.0;
  if (t >= uQ[64]) return 1.0;
  float r = 1.0;
  for (int i = 0; i < 64; i++) {
    float a = uQ[i], b = uQ[i + 1];
    if (t < b) { r = (float(i) + clamp((t - a) / max(b - a, 1e-7), 0.0, 1.0)) / 64.0; break; }
  }
  return r;
}

vec3 paletteLab(float r) {
  vec3 c = uCol[0];
  for (int i = 0; i < 9; i++) {
    if (i >= uCount - 1) break;
    float w = uSoftB[i] + 1e-4;
    c = mix(c, uCol[i + 1], smoothstep(uStop[i] - w, uStop[i] + w, r));
  }
  return c;
}

vec3 oklabToSrgb(vec3 c) {
  float l = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  l = l * l * l; m = m * m * m; s = s * s * s;
  vec3 lin = clamp(vec3(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                       -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                       -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s), 0.0, 1.0);
  return mix(12.92 * lin, 1.055 * pow(lin, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, lin));
}

void main() {
  vec2 k = uOut / uRes;
  vec2 px = gl_FragCoord.xy * k;          // output-pixel coordinates
  float outMin = min(uOut.x, uOut.y);
  vec2 uv = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / min(uRes.x, uRes.y);

  // Analog interference: magnetic tearing in sparse horizontal bands + heat shimmer
  float band = 0.0;
  if (uMode == 1 && uCorrupt > 0.0) {
    band = smoothstep(0.45, 0.9, snoise(vec2(px.y / (outMin * 0.035), 3.7) + uCorT));
    float tear = snoise(vec2(px.y / 2.5, 11.0) + uCorT * 4.0);
    float dx = uCorrupt * band * (0.4 + 0.6 * tear) * outMin * 0.04;
    vec2 heat = vec2(snoise(px / (outMin * 0.02) + uCorT + 5.0), snoise(px / (outMin * 0.02) + uCorT + 9.0));
    vec2 d = vec2(dx, 0.0) + heat * uCorrupt * outMin * 0.005;
    uv += vec2(d.x, -d.y) / outMin;
  }

  float t = sampleField(uv);

  if (uMode == 0) {
    float v = floor(t * 65535.0 + 0.5);
    o = vec4(floor(v / 256.0) / 255.0, mod(v, 256.0) / 255.0, 0.0, 1.0);
    return;
  }

  float r = rankOf(t);
  float fw = max(fwidth(r), 1e-5);

  // How close is this pixel to a colour boundary (in output px)?
  float bd = 1.0;
  for (int i = 0; i < 9; i++) {
    if (i >= uCount - 1) break;
    bd = min(bd, abs(r - uStop[i]));
  }
  float edge = exp(-(bd / fw) * k.x / (outMin * 0.015));

  // Chemical blotches: patches where the surface is stained and noisier
  float chemN = fbm(px / (outMin * 0.12) + uSeed * 1.7, 3);
  float chem = smoothstep(0.12, 0.55, chemN);

  vec3 base = paletteLab(r);
  float dark = 1.0 - smoothstep(0.3, 0.85, base.x);
  // Texture density gathers at boundaries and in dark regions
  float density = clamp(edge + 0.55 * dark + 0.7 * chem * uCorrupt, 0.0, 1.0);

  vec2 cell = floor(px / uGrainSize);
  float clump = 0.5 + 0.5 * snoise(px * vec2(1.0, 0.45) / (uGrainSize * 6.0) + uSeed);
  float white = hash(cell + 3.0) - 0.5;

  // Boundaries break up into granular, streaky edges
  float rj = r + uSpeckle * density * (white * 0.7 + (clump - 0.5) * 0.6) * 0.12;
  vec3 lab = paletteLab(rj);

  // Speckle: clustered dots of a neighbouring colour where density is high
  float p = uSpeckle * density * smoothstep(0.3, 0.85, clump) * 0.45;
  if (hash(cell + 17.0) < p) {
    float dir = hash(cell + 41.0) < 0.5 ? -1.0 : 1.0;
    lab = mix(lab, paletteLab(clamp(r + dir * (0.06 + 0.14 * hash(cell + 59.0)), 0.0, 1.0)), 0.85);
  }
  // Sparse ink specks that break up smooth areas
  if (hash(cell + 83.0) < uSpeckle * (0.004 + 0.02 * chem + 0.01 * edge)) lab.x *= 0.35;

  // Chemical staining: bleached patches with darker tide-lines
  float stain = smoothstep(0.08, 0.12, chemN) - smoothstep(0.12, 0.2, chemN);
  lab = mix(lab, vec3(min(lab.x + 0.1, 1.0), lab.yz * 0.55), chem * uCorrupt * 0.45);
  lab.x -= stain * uCorrupt * 0.08;

  vec3 c = oklabToSrgb(lab);

  // Magnetic bands carry line noise
  c += band * uCorrupt * (hash(vec2(floor(px.y / 2.0), uGrainT + 7.0)) - 0.5) * 0.18;

  vec2 gp = cell + vec2(uGrainT * 37.0, uGrainT * 11.0);
  float g = hash(gp) + hash(gp + vec2(17.0, 91.0)) - 1.0;
  c += g * uGrain * (0.3 + 0.9 * density) * 0.3;

  o = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

function createRenderer(canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  const locs = {};
  const loc = n => (n in locs ? locs[n] : (locs[n] = gl.getUniformLocation(prog, n)));

  const lutTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, lutTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fbo = gl.createFramebuffer();
  let lutW = 0, lutH = 0;

  function setUniforms(u) {
    gl.uniform2f(loc('uOut'), u.outW, u.outH);
    gl.uniform2f(loc('uSeed'), u.seed[0], u.seed[1]);
    gl.uniform2f(loc('uCorT'), u.corT[0], u.corT[1]);
    gl.uniform1f(loc('uTime'), u.time);
    gl.uniform1i(loc('uLoop'), u.loop ? 1 : 0);
    gl.uniform1f(loc('uLoopLen'), u.loopLen);
    gl.uniform1f(loc('uScale'), u.scale);
    gl.uniform1i(loc('uOctaves'), u.octaves);
    gl.uniform1f(loc('uFluid'), u.fluid);
    gl.uniform1f(loc('uDisturb'), u.disturb);
    gl.uniform1f(loc('uTurb'), u.turb);
    gl.uniform1f(loc('uStretch'), u.stretch);
    gl.uniform1f(loc('uDrip'), u.drip);
    gl.uniform1f(loc('uDripFreq'), u.dripFreq);
    gl.uniform1f(loc('uGravity'), u.gravity);
    gl.uniform1f(loc('uBands'), u.bands);
    gl.uniform1i(loc('uCount'), u.count);
    gl.uniform3fv(loc('uCol'), u.cols);
    gl.uniform1fv(loc('uStop'), u.stops);
    gl.uniform1fv(loc('uSoftB'), u.softB);
    gl.uniform1f(loc('uSpeckle'), u.speckle);
    gl.uniform1f(loc('uCorrupt'), u.corrupt);
    gl.uniform1f(loc('uGrain'), u.grain);
    gl.uniform1f(loc('uGrainSize'), u.grainSize);
    gl.uniform1f(loc('uGrainT'), u.grainT);
  }

  // Render the raw field small, read it back and take 65 quantiles
  function computeLUT(u) {
    const samples = 24000, aspect = u.outW / u.outH;
    const w = Math.max(8, Math.round(Math.sqrt(samples * aspect)));
    const h = Math.max(8, Math.round(samples / w));
    if (w !== lutW || h !== lutH) {
      gl.bindTexture(gl.TEXTURE_2D, lutTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, lutTex, 0);
      lutW = w; lutH = h;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, w, h);
    setUniforms(u);
    gl.uniform2f(loc('uRes'), w, h);
    gl.uniform1i(loc('uMode'), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    const n = w * h, vals = new Float32Array(n);
    for (let i = 0; i < n; i++) vals[i] = (px[i * 4] * 256 + px[i * 4 + 1]) / 65535;
    vals.sort();
    const q = new Float32Array(65);
    for (let i = 0; i <= 64; i++) q[i] = vals[Math.min(n - 1, Math.round(i / 64 * (n - 1)))];
    for (let i = 1; i <= 64; i++) if (q[i] <= q[i - 1]) q[i] = q[i - 1] + 1e-6;
    return q;
  }

  function draw(u, lut, tile = 0) {
    const W = canvas.width, H = canvas.height;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    setUniforms(u);
    gl.uniform2f(loc('uRes'), W, H);
    gl.uniform1i(loc('uMode'), 1);
    gl.uniform1fv(loc('uQ'), lut);
    if (!tile) { gl.drawArrays(gl.TRIANGLES, 0, 3); return; }
    // Large exports render in tiles so the GPU never stalls on one huge draw
    gl.enable(gl.SCISSOR_TEST);
    for (let y = 0; y < H; y += tile) {
      for (let x = 0; x < W; x += tile) {
        gl.scissor(x, y, tile, tile);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.finish();
      }
    }
    gl.disable(gl.SCISSOR_TEST);
  }

  return {
    gl, computeLUT, draw,
    maxSize: Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), ...gl.getParameter(gl.MAX_VIEWPORT_DIMS)),
    dispose() { const ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); },
  };
}

// ---------- Colour helpers ----------

function normHex(v) {
  let s = String(v).trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(s)) s = s.split('').map(c => c + c).join('');
  return /^[0-9a-f]{6}$/i.test(s) ? '#' + s.toUpperCase() : null;
}
const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

function hexToOklab(h) {
  const [r, g, b] = hexToRgb(h).map(c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [
    0.2104542553 * l + 0.7936177850 * m - 0.0040720123 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
  ];
}

function randomHex() {
  const h = Math.random() * 360, s = 0.35 + Math.random() * 0.5, l = 0.25 + Math.random() * 0.55;
  const f = n => { const k = (n + h / 30) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
}

// Changing one colour's share rescales the others so the total stays 100
function setPct(i, v) {
  const cs = state.colors;
  v = Math.max(0, Math.min(100, v));
  const rest = cs.reduce((a, c, j) => a + (j === i ? 0 : c.pct), 0);
  const remain = 100 - v;
  cs.forEach((c, j) => {
    if (j !== i) c.pct = rest > 0 ? c.pct * remain / rest : remain / (cs.length - 1);
  });
  cs[i].pct = v;
}

// ---------- Uniforms ----------

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

const flowRate = () => (state.speed / 100) * 0.15;
const looping = () => state.animate && state.loop && flowRate() > 0;

// sec: clock in seconds; frame: integer frame index (drives grain flicker)
function buildUniforms(outW, outH, sec = seconds, frame = frameCount) {
  const s = state;
  const rnd = mulberry32(s.seed | 0);
  const seed = [rnd() * 80 + 10, rnd() * 80 + 10];
  const active = s.colors.filter(c => c.pct > 0.05);
  const total = active.reduce((a, c) => a + c.pct, 0) || 1;
  const widths = active.map(c => c.pct / total);
  const cols = new Float32Array(30), stops = new Float32Array(10), softB = new Float32Array(10);
  const soft = 0.002 + Math.pow(s.blend / 100, 1.6) * 0.5;
  let acc = 0;
  active.forEach((c, i) => { cols.set(hexToOklab(c.hex), i * 3); });
  for (let i = 0; i < active.length - 1; i++) {
    acc += widths[i];
    stops[i] = acc;
    softB[i] = Math.min(soft, 0.9 * Math.min(widths[i], widths[i + 1]));
  }

  const loop = looping();
  const loopLen = s.duration * flowRate();
  let time, corT;
  if (loop) {
    // Interference drifts round a circle so it also returns to its start
    const phase = (sec % s.duration) / s.duration;
    const R = s.duration * 0.15;
    time = phase * loopLen;
    corT = [seed[0] + Math.cos(phase * 2 * Math.PI) * R, seed[1] + Math.sin(phase * 2 * Math.PI) * R];
  } else {
    time = sec * flowRate();
    corT = [seed[0] + sec * 0.8, seed[1]];
  }

  return {
    outW, outH, seed, corT, time, loop, loopLen: Math.max(loopLen, 1e-3),
    scale: 1.0 / s.size,
    octaves: s.complexity,
    fluid: s.fluid / 100 * 2,
    disturb: Math.pow(s.disturb / 100, 1.5),
    turb: 0.3 + s.turb / 100 * 2.7,
    stretch: 1 + s.stretch / 100 * 5,
    drip: s.drip / 100 * 1.5,
    dripFreq: 0.5 + s.dripFreq / 100 * 7.5,
    gravity: s.gravity / 100,
    bands: s.bands,
    count: Math.max(1, active.length), cols, stops, softB,
    speckle: s.speckle / 100,
    corrupt: s.corrupt / 100,
    grain: s.grain / 100,
    grainSize: s.grainSize,
    grainT: s.animate ? frame % 997 : 0,
  };
}

// ---------- Preview ----------

const view = document.getElementById('view');
const stage = document.getElementById('stage');
const renderer = createRenderer(view);
let dirty = true, lutKey = '', lut = null;

function fitCanvas() {
  const r = stage.getBoundingClientRect();
  const cs = getComputedStyle(stage);
  const availW = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const aspect = state.width / state.height;
  let w = availW, h = w / aspect;
  if (h > availH) { h = availH; w = h * aspect; }
  view.style.width = Math.floor(w) + 'px';
  view.style.height = Math.floor(h) + 'px';
  const dpr = window.devicePixelRatio || 1;
  let pw = w * dpr, ph = h * dpr;
  const cap = Math.min(1, state.width / pw, 2400 / Math.max(pw, ph));
  view.width = Math.max(1, Math.round(pw * cap));
  view.height = Math.max(1, Math.round(ph * cap));
  dirty = true;
}
new ResizeObserver(fitCanvas).observe(stage);

function fieldKey(u) {
  return [u.outW / u.outH, u.seed, u.time, u.loop, u.loopLen, u.scale, u.octaves, u.fluid, u.disturb, u.turb, u.stretch,
    u.drip, u.dripFreq, u.gravity, u.bands].join('|');
}

function renderPreview() {
  const u = buildUniforms(state.width, state.height);
  const key = fieldKey(u);
  if (key !== lutKey) { lut = renderer.computeLUT(u); lutKey = key; }
  renderer.draw(u, lut);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (state.animate && !exporting) {
    seconds += dt;
    frameCount++;
    dirty = true;
  }
  if (dirty) { renderPreview(); dirty = false; }
  requestAnimationFrame(frame);
}

function changed() { dirty = true; save(); }

// ---------- UI: shared slider row ----------

const sliderRefs = {};

function sliderRow(it, parent) {
  const row = document.createElement('div');
  row.className = 'row';
  const id = 'ctl-' + it.k;
  const lab = document.createElement('label');
  lab.htmlFor = id; lab.textContent = it.label;
  const range = document.createElement('input');
  range.type = 'range'; range.id = id;
  const num = document.createElement('input');
  num.type = 'number';
  num.setAttribute('aria-label', it.label);
  for (const el of [range, num]) { el.min = it.min; el.max = it.max; el.step = it.step; }
  range.addEventListener('input', () => { state[it.k] = +range.value; num.value = range.value; changed(); });
  num.addEventListener('change', () => {
    let v = +num.value;
    if (num.value === '' || isNaN(v)) v = state[it.k];
    v = Math.max(it.min, Math.min(it.max, v));
    state[it.k] = v; num.value = v; range.value = v; changed();
  });
  row.append(lab, range, num);
  parent.appendChild(row);
  if (it.ends) {
    const ends = document.createElement('div');
    ends.className = 'ends';
    it.ends.forEach(t => { const s = document.createElement('span'); s.textContent = t; ends.appendChild(s); });
    parent.appendChild(ends);
  }
  sliderRefs[it.k] = { range, num };
}

function toggleRow(k, label, parent, onChange) {
  const lab = document.createElement('label');
  lab.className = 'toggle';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.addEventListener('change', () => { state[k] = cb.checked; onChange && onChange(); changed(); });
  lab.append(cb, document.createTextNode(label));
  parent.appendChild(lab);
  sliderRefs[k] = { checkbox: cb };
}

// ---------- UI: colours ----------

const colorList = document.getElementById('colorList');
const coverage = document.getElementById('coverage');
const addBtn = document.getElementById('addColor');
const fmtPct = v => String(Math.round(v * 10) / 10);
let dragFrom = -1;

function renderCoverage() {
  coverage.innerHTML = '';
  state.colors.forEach(c => {
    const seg = document.createElement('div');
    seg.style.background = c.hex;
    seg.style.width = c.pct + '%';
    coverage.appendChild(seg);
  });
}

function refreshColorValues(skip) {
  [...colorList.children].forEach((row, i) => {
    const c = state.colors[i];
    if (row._range !== skip) row._range.value = c.pct;
    if (row._num !== skip) row._num.value = fmtPct(c.pct);
  });
  renderCoverage();
}

function renderColors() {
  colorList.innerHTML = '';
  state.colors.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'crow';

    const handle = document.createElement('div');
    handle.className = 'handle';
    handle.textContent = '⋮⋮';
    handle.title = 'Drag to reorder — neighbouring colours bleed into each other';
    handle.addEventListener('pointerdown', () => { row.draggable = true; });
    row.addEventListener('dragstart', e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragend', () => { row.draggable = false; [...colorList.children].forEach(r => r.classList.remove('over')); });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave', () => row.classList.remove('over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      if (dragFrom < 0 || dragFrom === i) return;
      const [m] = state.colors.splice(dragFrom, 1);
      state.colors.splice(i, 0, m);
      dragFrom = -1;
      renderColors(); changed();
    });

    const swatch = document.createElement('input');
    swatch.type = 'color'; swatch.className = 'swatch'; swatch.value = c.hex.toLowerCase();
    swatch.setAttribute('aria-label', 'Pick colour');

    const hex = document.createElement('input');
    hex.type = 'text'; hex.value = c.hex; hex.spellcheck = false; hex.maxLength = 7;
    hex.setAttribute('aria-label', 'Hex code');

    swatch.addEventListener('input', () => {
      c.hex = swatch.value.toUpperCase(); hex.value = c.hex; hex.classList.remove('bad');
      renderCoverage(); changed();
    });
    hex.addEventListener('input', () => {
      const n = normHex(hex.value);
      hex.classList.toggle('bad', !n);
      if (n) { c.hex = n; swatch.value = n.toLowerCase(); renderCoverage(); changed(); }
    });
    hex.addEventListener('blur', () => { hex.value = c.hex; hex.classList.remove('bad'); });

    const range = document.createElement('input');
    range.type = 'range'; range.min = 0; range.max = 100; range.step = 0.1; range.value = c.pct;
    range.setAttribute('aria-label', 'Coverage');

    const pctWrap = document.createElement('div');
    pctWrap.className = 'pct';
    const num = document.createElement('input');
    num.type = 'number'; num.min = 0; num.max = 100; num.step = 0.1; num.value = fmtPct(c.pct);
    num.setAttribute('aria-label', 'Coverage percent');
    pctWrap.appendChild(num);

    range.addEventListener('input', () => { setPct(i, +range.value); refreshColorValues(range); changed(); });
    num.addEventListener('change', () => {
      if (num.value === '' || isNaN(+num.value)) { num.value = fmtPct(c.pct); return; }
      setPct(i, +num.value); refreshColorValues(); changed();
    });

    const remove = document.createElement('button');
    remove.className = 'remove'; remove.textContent = '×'; remove.title = 'Remove colour';
    remove.disabled = state.colors.length <= 2;
    remove.addEventListener('click', () => {
      state.colors.splice(i, 1);
      const rest = state.colors.reduce((a, x) => a + x.pct, 0);
      state.colors.forEach(x => { x.pct = rest > 0 ? x.pct * 100 / rest : 100 / state.colors.length; });
      renderColors(); changed();
    });

    row._range = range; row._num = num;
    row.append(handle, swatch, hex, range, pctWrap, remove);
    colorList.appendChild(row);
  });
  addBtn.disabled = state.colors.length >= MAX_COLORS;
  renderCoverage();
}

addBtn.addEventListener('click', () => {
  if (state.colors.length >= MAX_COLORS) return;
  const n = state.colors.length;
  state.colors.forEach(c => { c.pct = c.pct * n / (n + 1); });
  state.colors.push({ hex: randomHex(), pct: 100 / (n + 1) });
  renderColors(); changed();
});

sliderRow(BLEND, document.getElementById('colorSection'));

function bindDim(input, key) {
  input.addEventListener('change', () => {

}

function thumbnail() {
  renderPreview();
  const c = document.createElement('canvas');
  c.width = 192; c.height = 120;
  const ctx = c.getContext('2d');
  // cover-crop the preview into the tile
  const s = Math.max(c.width / view.width, c.height / view.height);
  const w = c.width / s, h = c.height / s;
  ctx.drawImage(view, (view.width - w) / 2, (view.height - h) / 2, w, h, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}

function renderLooks() {
  looksEl.innerHTML = '';
  looks.forEach((lk, i) => {
    const tile = document.createElement('div');

    del.className = 'remove'; del.textContent = '×'; del.title = 'Delete ' + lk.name;

    looksEl.appendChild(tile);
  });
}

    size: between(0.6, 1.8, 0.01), fluid: between(20, 70), disturb: between(15, 85), turb: between(10, 50),
    stretch: between(10, 60), drip: between(10, 70), dripFreq: between(5, 40), gravity: between(40, 95),
    complexity: between(3, 7), bands: Math.random() < 0.7 ? 1 : between(1.5, 3, 0.1),
  });
  syncUI(); changed();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state = clone(DEFAULTS); seconds = 0; frameCount = 0;
  syncUI(); changed();
});

const exportBtn = document.getElementById('exportBtn');
let exporting = false, cancelExport = false;

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function exportPNG() {
  const W = state.width, H = state.height;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const r = createRenderer(off);
  try {
    if (Math.max(W, H) > r.maxSize) throw new Error(`Your GPU supports up to ${r.maxSize}px per side.`);
    const u = buildUniforms(W, H);
    r.draw(u, r.computeLUT(u), 1024);
    const blob = await new Promise(res => off.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Image too large for this browser.');
    download(blob, `gradient-${state.seed}-${W}x${H}.png`);
  } finally {
    r.dispose();
  }
}

let muxerLib;
function loadMuxer() {
  if (window.Mp4Muxer) return Promise.resolve(window.Mp4Muxer);
  return muxerLib || (muxerLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js';
    s.onload = () => res(window.Mp4Muxer);
    s.onerror = () => { muxerLib = null; rej(new Error('Could not load the MP4 library — an internet connection is needed for video export.')); };
    document.head.appendChild(s);
  }));
}

// Find an H.264 config the browser can encode, shrinking the frame if it is too large
async function pickVideoConfig(W, H, fps) {
  if (!('VideoEncoder' in window)) throw new Error('This browser cannot encode video. Try a recent Chrome, Edge or Safari.');
  const codecs = ['avc1.640034', 'avc1.640033', 'avc1.64002A', 'avc1.4D0034', 'avc1.42003E'];
  let scale = Math.min(1, Math.sqrt(9437184 / (W * H)), 8192 / Math.max(W, H));
  for (let attempt = 0; attempt < 10; attempt++, scale *= 0.85) {
    const width = Math.max(2, Math.round(W * scale / 2) * 2), height = Math.max(2, Math.round(H * scale / 2) * 2);
    for (const codec of codecs) {
      const cfg = { codec, width, height, framerate: fps, bitrate: Math.min(60e6, Math.round(width * height * fps * 0.2)) };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch (e) {}
    }
  }
  throw new Error('No supported MP4 encoder settings were found for this size.');
}

async function exportMP4() {
  const Mp4Muxer = await loadMuxer();
  const fps = state.fps, N = Math.round(state.duration * fps);
  const cfg = await pickVideoConfig(state.width, state.height, fps);
  const off = document.createElement('canvas');
  off.width = cfg.width; off.height = cfg.height;
  const r = createRenderer(off);
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: cfg.width, height: cfg.height, frameRate: fps },
    fastStart: 'in-memory',
  });
  let encodeError = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encodeError = e; } });
  enc.configure(cfg);
  // A seamless loop starts at 0; a plain clip continues from the preview's current moment
  const start = looping() ? 0 : seconds;
  try {
    for (let i = 0; i < N; i++) {
      if (cancelExport) throw new Error('cancelled');
      if (encodeError) throw encodeError;
      const u = buildUniforms(cfg.width, cfg.height, start + i / fps, i);
      r.draw(u, r.computeLUT(u), cfg.width * cfg.height > 4e6 ? 1024 : 0);
      const vf = new VideoFrame(off, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(vf, { keyFrame: i % (fps * 2) === 0 });
      vf.close();
      while (enc.encodeQueueSize > 3) await new Promise(res => setTimeout(res, 5));
      exportBtn.textContent = `Rendering ${Math.round((i + 1) / N * 100)}% — click to cancel`;
      await new Promise(res => setTimeout(res, 0));
    }
    await enc.flush();
    muxer.finalize();
    download(new Blob([muxer.target.buffer], { type: 'video/mp4' }),
      `gradient-${state.seed}-${cfg.width}x${cfg.height}${looping() ? '-loop' : ''}.mp4`);
  } finally {
    if (enc.state !== 'closed') enc.close();
    r.dispose();
  }
}

exportBtn.addEventListener('click', async () => {
  if (exporting) { cancelExport = true; return; }
  exporting = true; cancelExport = false;
  exportBtn.textContent = 'Rendering…';
  await new Promise(res => setTimeout(res, 30));
  try {
    await (state.animate ? exportMP4() : exportPNG());
  } catch (e) {
    if (e.message !== 'cancelled') alert('Export failed: ' + e.message);
  }
  exporting = false;
  updateModeUI();
});

buildGroups();
renderLooks();
syncUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
